name: CI

# Comprueba cada PR (y cada push a main) ANTES de que el código roto llegue a
# producción. Caza justo lo que nos ha tumbado deploys: errores de TypeScript,
# dependencias sin instalar, y migraciones inválidas. Corre en GitHub (no toca
# el VPS) y NO necesita secrets.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ hace falta para --experimental-strip-types (test:particulares
          # corre los .mts de scripts/ directo, sin ts-node/tsx instalados).
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript (compila el proyecto entero)
        run: npx tsc --noEmit

      - name: Particulares (parsers de teléfono/cross-match, offline)
        run: npm run test:particulares

      # Valida lo que generamos para el Partner API contra los JSON Schema
      # oficiales de Idealista (vendorizados en el repo). Es lo que evita
      # descubrir un nombre de campo mal escrito con un 400 en producción.
      - name: Idealista Partner API (payload contra los schemas, offline)
        run: npm run test:idealista

      # La regla que decide si dos leads son la MISMA persona. Un falso
      # positivo esconde un lead de la bandeja, así que se vigila en CI.
      - name: Unificación de leads (regla de fusión, offline)
        run: npm run test:lead-merge

      - name: Zinto v2 (Integration ID UUID, offline)
        run: npm run test:zinto-v2

      # HOME de Fabricio y catálogos (BCP-01): acceso solo del dueño, formato
      # de precios/planta y referencias para añadir propiedades. Puro, sin BD.
      - name: Catálogos (acceso y formato, offline)
        run: npm run test:catalogs
      - name: Catálogos (contrato público, sincronización y medición, offline)
        run: npm run test:catalogs-public
      # E2: gestor en secciones (valores sin guardar, guardados en curso,
      # conflictos, material y filtros). Puro, sin BD.
      - name: "Catálogos (gestor: borradores y diagnósticos, offline)"
        run: npm run test:catalogs-manager
      - name: "Catálogos: buscador (filtros, URL, texto y planta, paginación; offline)"
        run: npm run test:catalog-search

      # Permisos y cuentas del equipo. Son las reglas que impiden que alguien
      # escale privilegios (rango entre roles, quién crea qué rol, quién fija
      # una contraseña, quién suspende), el análisis estático que falla si una
      # ruta de /api/admin se queda sin guard, y la política de la capa de
      # entrada. Puro, sin BD ni red.
      - name: "Permisos: roles visibles y jerarquía (offline)"
        run: npm run test:role-model && npm run test:user-rank
      - name: "Permisos: toda ruta de /api/admin lleva guard (análisis estático)"
        run: npm run test:api-guards
      - name: "Permisos: sesión en la capa de entrada, secreto de cron y acciones de infraestructura (offline)"
        run: npm run test:api-session-policy && npm run test:cron-secret && npm run test:infra-action
      - name: "Permisos: términos de búsqueda de clientes acotados (offline)"
        run: npm run test:search-term

      - name: Build de Next.js (lo MISMO que corre el VPS al desplegar)
        run: npm run build
        env:
          # Valores ficticios: el build solo necesita que existan para instanciar
          # los clientes. Las llamadas a red durante el prerender son tolerantes
          # y no rompen el build. Esto replica exactamente lo que hace el VPS.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key

      - name: Migraciones (sin errores que rompan el deploy)
        run: python3 scripts/lint-migrations.py
