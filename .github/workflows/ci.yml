name: CI

# Comprueba cada PR (y cada push a main) ANTES de que el código roto llegue a
# producción. Caza justo lo que nos ha tumbado deploys: errores de TypeScript,
# dependencias sin instalar, y migraciones inválidas. Corre en GitHub (no toca
# el VPS) y NO necesita secrets.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript (compila el proyecto entero)
        run: npx tsc --noEmit

      - name: Particulares (parsers de teléfono/cross-match, offline)
        run: npm run test:particulares

      - name: Build de Next.js (lo MISMO que corre el VPS al desplegar)
        run: npm run build
        env:
          # Valores ficticios: el build solo necesita que existan para instanciar
          # los clientes. Las llamadas a red durante el prerender son tolerantes
          # y no rompen el build. Esto replica exactamente lo que hace el VPS.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key

      - name: Migraciones (sin errores que rompan el deploy)
        run: python3 scripts/lint-migrations.py
