name: Deploy to VPS (manual)

# AUTO-DEPLOY: lo hace el VPS por sí mismo con un cron cada minuto
# (/opt/vps-autodeploy.sh: sincroniza VPS ↔ GitHub en los dos sentidos, build,
# migraciones, swap atómico y health check). Ver DEPLOY.md. Este workflow NO se
# dispara con push: es un botón MANUAL en la pestaña Actions para REINTENTAR un
# deploy que falló (el cron no reintenta solo un commit cuyo build falló).
#
# ⚠️ Antes subía el código con rsync encima de /opt/smartbc-app. Eso pisaba
# cualquier cambio hecho directamente en el VPS (y el cron lo habría commiteado
# después como si fuera un cambio del VPS, deshaciéndolo en GitHub). Ahora solo
# le pide al VPS que ejecute su propio script: el código lo trae el VPS por git.
#
# Para usarlo hace falta el secret VPS_SSH_KEY (clave privada autorizada en el
# VPS). El cron NO lo necesita.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_HOST: 178.105.185.125
  VPS_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar clave SSH
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Falta el secret VPS_SSH_KEY (solo necesario para el deploy manual)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Reintentar el deploy en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "rm -f /opt/smartbc-deploy/fallido && /opt/vps-autodeploy.sh; tail -n 15 /var/log/smartbc-autodeploy.log"
