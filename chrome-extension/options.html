<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>SmartBC → Idealista · Opciones</title>
  <style>
    body { font: 14px/1.5 -apple-system, sans-serif; margin: 0; padding: 18px; min-width: 380px; color: #1a1a1a; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 4px 0 12px; color: #666; font-size: 12px; }
    label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 12px; font-family: monospace; }
    button { margin-top: 10px; padding: 8px 16px; border: 0; border-radius: 8px; background: #1a1a1a; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
    button:hover { background: #333; }
    #status { margin-left: 10px; font-size: 12px; color: #0a7d4f; }
  </style>
</head>
<body>
  <h1>🏠 SmartBC → Idealista</h1>
  <p>Pega aquí el token generado en SmartBC para poder enviar los contactos del inbox de Idealista al portal.</p>
  <label for="token">Token SmartBC</label>
  <input id="token" type="text" placeholder="eyJ..." autocomplete="off" spellcheck="false" />
  <button id="save">Guardar</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
